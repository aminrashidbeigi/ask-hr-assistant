services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askhr
      POSTGRES_PASSWORD: askhr
      POSTGRES_DB: askhr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askhr -d askhr"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://askhr:askhr@db:5432/askhr
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-google}
      CHAT_MODEL: ${CHAT_MODEL:-gemini-2.5-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-google}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}

volumes:
  pgdata:
